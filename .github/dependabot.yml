version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    # Bloque les mises a jour de version pour lodash (ignore ne s'applique
    # qu'aux version-updates, pas aux security-updates) pour isoler le test
    # sur la PR de securite groupee (GRAPHQL-3251), sans toucher au reste
    # du mecanisme dependabot comme le faisait open-pull-requests-limit: 0.
    ignore:
      - dependency-name: "lodash"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      security-patch-minor:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      security-major:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - major
